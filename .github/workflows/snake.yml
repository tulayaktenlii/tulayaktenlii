
name: Generate Pink Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate pink snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tulayaktenlii
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23FF80BF&color_dots=%23FCE7F3,%23FBCFE8,%23F9A8D4,%23F472B6,%23DB2777
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FF80BF&color_dots=%231B1524,%235B315F,%239D4E91,%23E879B9,%23FFB3D9

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
